
<section class="portfolio">
  <header class="portfolio-header">
    <h1>Portfolio</h1>
    <p>A collection of manga pages and illustrations.</p>
  </header>

  <div class="portfolio-filters">
    <button
      type="button"
      [class.active]="selectedCategory() === 'all'"
      (click)="setCategory('all')"
    >
      All
    </button>

    <button
      type="button"
      [class.active]="selectedCategory() === 'manga'"
      (click)="setCategory('manga')"
    >
      Manga
    </button>

    <button
      type="button"
      [class.active]="selectedCategory() === 'illustration'"
      (click)="setCategory('illustration')"
    >
      Illustrations
    </button>
    
    <button
      type="button"
      [class.active]="selectedCategory() === 'character-design'"
      (click)="setCategory('character-design')"
    >
      Character Design
    </button>

    <button
      type="button"
      [class.active]="selectedCategory() === 'background'"
      (click)="setCategory('background')"
    >
      Backgrounds
    </button>

  </div>

  <div class="portfolio-gallery">
    @for (artwork of filteredArtworks(); track artwork.id) {
      <article class="artwork-card">
        
        <button
          class="artwork-image"
          type="button"
          [attr.aria-label]="'View ' + artwork.title"
          (click)="openLightbox(artwork)"
        >
          <img
            [src]="artwork.image"
            [alt]="artwork.title"
            loading="lazy"
          />
        </button>


        <div class="artwork-info">
          <span>{{ artwork.category }}</span>
        </div>
      </article>
    }
  </div>
</section>



@if (selectedArtwork(); as artwork) {
  <div class="lightbox" (click)="closeLightbox()">

    <button
      class="lightbox-close"
      type="button"
      aria-label="Close image"
      (click)="closeLightbox()"
    >
      &times;
    </button>

    <button
      class="lightbox-prev"
      type="button"
      aria-label="Previous artwork"
      (click)="$event.stopPropagation(); navigateLightbox(-1)"
    >
      &#10094;
    </button>

    <div
      class="lightbox-content"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="artwork.title"
      (click)="$event.stopPropagation()"
    >
      <img
        [src]="artwork.image"
        [alt]="artwork.title"
      />

      <p>{{ artwork.title }}</p>
    </div>

    <button
      class="lightbox-next"
      type="button"
      aria-label="Next artwork"
      (click)="$event.stopPropagation(); navigateLightbox(1)"
    >
      &#10095;
    </button>

  </div>
}
