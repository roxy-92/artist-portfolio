
<div class="app-root">
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">ARTIST SHOWCASE</span>
      <span class="brand-subtitle">Visual Media Portfolio</span>
    </div>

    
<button
  class="menu-toggle"
  type="button"
  aria-label="Toggle navigation menu"
  aria-controls="main-navigation"
  [attr.aria-expanded]="menuOpen()"
  (click)="toggleMenu()"
>
  <span></span>
  <span></span>
  <span></span>
</button>

<nav
    id="main-navigation"
    class="app-nav"
    aria-label="Main navigation"
    [class.open]="menuOpen()"
  >
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >Home</a>

    <a
      routerLink="/portfolio"
      routerLinkActive="active"
      (click)="closeMenu()"
    >Portfolio</a>

    <a
      routerLink="/about"
      routerLinkActive="active"
      (click)="closeMenu()"
    >About</a>

  </nav>

  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Florina Roxana Marinca Ardelean.
      All rights reserved.</p>
  </footer>
</div>
